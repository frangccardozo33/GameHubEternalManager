function synergy(g,t,a,p,sub){let base=.5*themeMatrix[g][themes.indexOf(t)]+.3*targetMatrix[g][targets.indexOf(a)]+.2*styleMatrix[g][styles.indexOf(p)];if(/Romántico|Soul|Bedroom/.test(sub)&&['Amor','Despecho'].includes(t))base+=.04;if(/Punk|Consciente/.test(sub)&&t==='Crítica Social')base+=.04;if(/Dembow|House|Dance/.test(sub)&&t==='Fiestas')base+=.04;return clamp(base,.25,1)}

function estimateQuality(a,c){let q=qualityBase(a,c);if(c.producer){const p=pro(c.producer);if(p)q+=p.reputation/100*4+p.relationship/100*6}if(c.collab)q+=3;return clamp(q)}
function computeCost(c){let cost=(c.production+c.tiktok+c.playlists+c.pr)*(RELEASE_KINDS[c.kind]?.mult||1);cost=Math.round(cost);if(c.collab)cost=Math.round(cost*1.25);if(c.producer)cost+=proFee(c.producer);if(c.promoter)cost+=proFee(c.promoter);return cost}
function releaseDuration(a,c){return 3+(a.traits.includes('Perfeccionista')?1:0)+(RELEASE_KINDS[c.kind]?.duration||0)}
function updateRanks(){const list=[...state.npcs,...state.songs.filter(s=>s.status==='released')].sort((a,b)=>b.daily-a.daily);list.forEach((s,i)=>{s.prevRank=s.rank||0;s.rank=i+1;if(s.artistId&&s.daily>0)s.bestRank=Math.min(s.bestRank||1000,s.rank)});return list}
function getChart(){return [...state.npcs,...state.songs.filter(s=>s.status==='released')].sort((a,b)=>b.daily-a.daily).slice(0,100)}
function launch(s){const a=artist(s.artistId);if(a.health<22){s.status='cancelled';addLog(`${a.name} cancela «${s.title}» por agotamiento. La producción ya está pagada.`);addFeed('news','Backstage Wire',`${a.name} prioriza su salud y cancela su próximo lanzamiento. El equipo pide respeto.`);return}s.status='released';s.age=0;s.releaseDay=state.day;s.daily=0;s.rank=0;if(s.collabWith){const partner=artist(s.collabWith);if(partner){partner.fame=clamp(partner.fame+2);s.hype*=1.08;addFeed('news','Backstage Wire',`${a.name} y ${partner.name} unen fuerzas en «${s.title}».`)}}const rating=clamp(s.quality/10+between(-.65,.65)+journalistBonus(),1,10).toFixed(1);addFeed('review',pick(['Pitchline','Rolling Notes','The Needle']),`«${s.title}» de ${a.name}. ${s.quality>=80?'Una identidad clara, una ejecución brillante. Merece estar en repeat.':s.quality>=65?'Buenas ideas y momentos memorables, aunque no todo termina de encajar.':'La ambición no compensa una propuesta que todavía busca su identidad.'}`,rating);addLog(`Ya disponible: «${s.title}» de ${a.name} (${RELEASE_KINDS[s.kind]?.label||'Single'}). Calidad final: ${Math.round(s.quality)}/100.`)}
function tick(){if(state.event||modal)return;state.day++;state.dailyRevenue=0;state.dailyStreams=0;state.artists.forEach(a=>{const working=state.songs.some(s=>s.artistId===a.id&&(s.status==='production'||s.status==='released'&&s.age<21));a.health=clamp(a.health+(a.restUntil>=state.day?3.4:working?-.42:.75)+(a.traits.includes('Fiestero')?-.18:0));if(!working)a.ego=clamp(a.ego-.07)});state.songs.filter(s=>s.status==='production'&&s.releaseDay<=state.day).forEach(launch);const markets=market();state.npcs.forEach((n,i)=>{n.age++;if(n.age>95&&rand()<.12){const newer=makeNPC(i);Object.assign(n,newer,{age:1,power:between(60000,480000)})}const m=markets.find(x=>x.genre===n.genre);n.daily=Math.round(n.power*lifeCurve(n.age,n.quality)*m.demand*m.saturation*between(.91,1.09));n.total+=n.daily});state.songs.filter(s=>s.status==='released').forEach(s=>{const a=artist(s.artistId);s.age++;const m=markets.find(x=>x.genre===s.genre);const promoRel=s.promoterId?(pro(s.promoterId)?.relationship||0):0;const marketing=1+Math.log1p(s.tiktok/1700)*.17*Math.exp(-s.age/24)+Math.log1p(s.playlists/2000)*.23*Math.exp(-s.age/50)+Math.log1p(s.pr/2200)*.15*Math.exp(-s.age/35)+promoRel/100*.12;const kindBoost=1+(RELEASE_KINDS[s.kind]?.duration||0)*.05;const base=(9000+a.fame*1800)*Math.pow(s.quality/65,2.1)*kindBoost;const rest=a.restUntil>=state.day?.76:.65+.35*a.health/100;const viralChance=.006+s.quality/100*.01+s.tiktok/15000*.014+(a.traits.includes('Viral Titan')?.018:0);if(s.age<=40&&rand()<viralChance){s.viral=Math.max(s.viral,between(1.5,2.8));addFeed('fan','@onrepeat',`El audio de «${s.title}» está por todas partes. No puedo sacármelo de la cabeza.`);addLog(`«${s.title}» se viraliza. Impulso temporal de ×${s.viral.toFixed(1)}.`)}s.viral=1+(s.viral-1)*.91;s.daily=Math.max(0,Math.round(base*lifeCurve(s.age,s.quality)*marketing*m.demand*m.saturation*rest*s.hype*s.viral*between(.9,1.1)));s.total+=s.daily;s.revenue+=s.daily*.0035*.8;state.dailyStreams+=s.daily;state.dailyRevenue+=s.daily*.0035*.8;s.history.push(s.daily);s.history=s.history.slice(-90);a.fame=clamp(a.fame+s.daily/900000-(s.age>45?.055:0));if(s.age===29&&s.quality>=87){addLog(`«${s.title}» se convierte en clásico de catálogo: su caída será más lenta.`);addFeed('news','The Daily Mix',`Más que un momento viral: «${s.title}» encuentra su lugar en el catálogo imprescindible.`)}});state.tours.filter(t=>t.status==='active'&&state.day>=t.endDay).forEach(t=>{const a=artist(t.artistId);if(!a)return;const revenue=Math.round(t.budget*(1+a.fame/100)*between(.8,1.35));state.cash+=revenue;t.revenue=revenue;t.status='done';const fameGain=Math.round(3+t.budget/5000);a.fame=clamp(a.fame+fameGain);a.health=clamp(a.health-between(5,15));addLog(`Gira de ${a.name} finalizada: recaudó ${money(revenue)} y sumó ${fameGain} puntos de fama.`);addFeed('news','Tour Wire',`${a.name} cierra su gira con ${money(revenue)} en ingresos y una base de fans más grande.`)});const overhead=Math.max(60,180+state.artists.length*70-execDiscount());state.expenses=overhead;state.cash+=state.dailyRevenue-overhead;state.totalRevenue+=state.dailyRevenue;state.totalStreams+=state.dailyStreams;updateRanks();state.history.push({day:state.day,daily:state.dailyStreams,total:state.totalStreams,revenue:state.dailyRevenue});state.history=state.history.slice(-180);if(state.day%3===0)organicFeed();if(state.day-state.lastEventDay>=5)maybeEvent();if(state.cash<0&&state.grants<2&&!state.event){state.cash+=15000;state.grants++;state.artists.forEach(a=>a.fame=clamp(a.fame-3));addLog('Anticipo de emergencia: +$15.000. El contrato de distribución reduce 3 puntos de fama por artista.');toast('Anticipo de emergencia: +$15.000. Revisa tus gastos.')}if(state.cash<-5000){playing=false;resetTimer();toast('Fondos agotados: pausa automática. Busca patrocinio en Mercado.')}save();render();if(state.event)openEvent()}
function organicFeed(){const tracks=state.songs.filter(s=>s.status==='released');if(!tracks.length){addFeed('news','Market Pulse',`${market().sort((a,b)=>b.trend-a.trend)[0].genre} gana fuerza en las playlists. Buen momento para preparar un lanzamiento.`);return}const s=pick(tracks),a=artist(s.artistId);let text;if(s.rank<=10)text=`${a.name} en el #${s.rank} global con «${s.title}». ¿Estamos viendo nacer una estrella?`;else if(s.daily>120000)text=pick([`«${s.title}» en repeat desde esta mañana. Banger absoluto.`,`${a.name} está en todas mis playlists. Este sí es su momento.`,`Quizá «${s.title}» está un poco sobrevalorada, pero el estribillo no se me va.`]);else if(s.quality<62)text=pick([`No conecté con «${s.title}». La producción no le hace justicia a ${a.name}.`,`Mucho hype para «${s.title}» y muy pocas ideas nuevas.`]);else text=pick([`«${s.title}» merece más atención. ${a.name} nunca decepciona.`,`No todo tiene que ser viral. «${s.title}» es para escucharla con calma.`,`Le di una oportunidad a «${s.title}». Ya la guardé en mi biblioteca.`]);addFeed('fan',pick(['@musicobsessed','@sofia.wav','@afterhours','@elclubdelrepeat','@indiekid','@daniel.mp3']),text)}
function maybeEvent(){const pending=state.songs.filter(s=>s.status==='production'),live=state.songs.filter(s=>s.status==='released'&&s.age<45);if(!pending.length&&!live.length)return;let s;if(pending.length){s=pick(pending);if(rand()<.48){createEvent(s,artist(s.artistId).ego>75?'ego':'leak');return}}if(live.length&&rand()<.12){s=pick(live);const a=artist(s.artistId);createEvent(s,rand()<a.scandal/100?'drama':'remix')}}
function createEvent(s,type){state.lastEventDay=state.day;state.event={type,songId:s.id};addLog(`Decisión pendiente para «${s.title}». El tiempo se detiene hasta que respondas.`)}
function eventDefinition(){const e=state.event;if(!e)return null;const s=state.songs.find(x=>x.id===e.songId),a=artist(s.artistId);const defs={leak:{title:'El single se ha filtrado.',tag:'CRISIS DE LANZAMIENTO',text:`Un fragmento de «${s.title}» circula antes del estreno. ${a.name} quiere saber qué harás. Puedes transformar el ruido en expectación o recuperar el control.`,options:[['Convertir la filtración en teaser','Sin coste · Hype +25% · Salud −8',0,()=>{s.hype*=1.25;a.health=clamp(a.health-8)}],['Retirar el contenido y proteger al artista','$2.000 · Salud +6 · Mantiene la fecha',2000,()=>{a.health=clamp(a.health+6)}]]},ego:{title:'«Sin videoclip, no hay lanzamiento».',tag:'EL PRECIO DEL EGO',text:`${a.name} se niega a rodar la promoción de «${s.title}». Exige más presupuesto y control creativo. Un ego de ${Math.round(a.ego)} complica la negociación.`,options:[['Aceptar sus condiciones','$5.000 · Hype +20% · Ego +6',5000,()=>{s.hype*=1.2;a.ego=clamp(a.ego+6)}],['Negociar una versión más sencilla','Sin coste · Retraso de 2 días · Ego −8 · Salud −5',0,()=>{s.releaseDay+=2;a.ego=clamp(a.ego-8);a.health=clamp(a.health-5)}]]},drama:{title:'El timeline está ardiendo.',tag:'DRAMA EN REDES',text:`${a.name} ha discutido públicamente con otro artista. «${s.title}» está en la conversación, pero la presión empieza a pasar factura.`,options:[['Aprovechar la conversación','Sin coste · Hype +35% · Salud −18 · Ego +8',0,()=>{s.hype*=1.35;a.health=clamp(a.health-18);a.ego=clamp(a.ego+8)}],['Pedir disculpas y desconectar','$1.500 · Salud +10 · Ego −5',1500,()=>{a.health=clamp(a.health+10);a.ego=clamp(a.ego-5)}],['Pausar la promoción y descansar','Sin coste · Salud +15 · Hype −15%',0,()=>{a.health=clamp(a.health+15);s.hype*=.85}]]},remix:{title:'Un remix puede cambiarlo todo.',tag:'OPORTUNIDAD CREATIVA',text:`El equipo de Nova K propone colaborar en «${s.title}». Una nueva audiencia, más visibilidad y una inversión que puede —o no— compensar.`,options:[['Firmar la colaboración','$ function resolveEvent(i){const d=eventDefinition(),o=d.options[i];if(o[2]>0&&state.cash<o[2])return toast('No hay fondos suficientes para esta decisión.');state.cash-=o[2];o[3]();addLog(`${d.a.name}: ${o[0]}. ${o[1]}.`);addFeed('news','Backstage Wire',`El equipo de ${d.a.name} toma una decisión sobre «${d.s.title}»: ${o[0].toLowerCase()}.`);state.event=null;closeModal(true);save();render();resetTimer()}

function dashboard(){const live=state.songs.filter(s=>s.status==='released'),top=live.filter(s=>s.rank<=100),prev=state.history.at(-2)?.daily||0;const growth=prev?(state.dailyStreams/prev-1)*100:0;const noArtists=!state.artists.length;return heading('Vista general',noArtists?'Sin artistas fichados.':'Resumen del sello.')+`<section class="hero"><div class="hero-copy"><h2>${noArtists?'Todavía no tienes artistas.':'Tu sello'}</h2><p>${noArtists?'Explora la escena underground, investiga talento y ficha a tu primer artista.':'Ficha artistas, produce lanzamientos y sube en las listas.'}</p><button class="text-btn" onclick="${noArtists?"navigate('underground')":'openProduction()'}">${noArtists?'Ir a la escena underground':'Nuevo lanzamiento'} ${icon('arrow')}</button></div><div class="hero-art" aria-hidden="true"><div class="record"></div><div class="record-sleeve"><div class="sleeve-bars">${[26,55,85,62,100,45,72,32].map(h=>`<i style="height:${h}px"></i>`).join('')}</div></div></div></section><div class="metric-grid">${metric('Balance del sello',money(state.cash),'wallet',`<span class="${state.dailyRevenue-state.expenses>=0?'positive':'muted'}">${state.dailyRevenue-state.expenses>=0?'+':''}${money(state.dailyRevenue-state.expenses)}</span> flujo neto / día`)}${metric('Streams totales',compact(state.totalStreams),'streams',`<span class="${growth>=0?'positive':'negative'}">${growth>=0?'↗':'↘'} ${Math.abs(growth).toFixed(1)}%</span> vs. día anterior`)}${metric('Ingresos diarios',money(state.dailyRevenue),'trend',`<span class="positive">${money(state.totalRevenue)}</span> acumulados netos de regalías`)}${metric('En el Top 100',String(top.length).padStart(2,'0'),'chart',`<span class="purple">${live.length?Math.min(...live.map(s=>s.rank))<=100?'#'+Math.min(...live.map(s=>s.rank)):'—':'—'}</span> mejor posición actual`)}</div><div class="dashboard-grid"><div class="left-column"><section class="panel chart-panel"><div class="panel-head"><div><h2>El pulso de tu sello</h2><div class="panel-sub">Streams por día.</div></div><select class="chart-select" aria-label="Período del gráfico" onchange="chartWindow=+this.value;drawChart()"><option value="30" ${chartWindow===30?'selected':''}>Últimos 30 días</option><option value="90" ${chartWindow===90?'selected':''}>Últimos 90 días</option></select></div><div class="chart-top"><span class="chart-total" id="chart-number">${compact(chartMode==='daily'?state.dailyStreams:state.totalStreams)}</span><span class="legend">Streams ${chartMode==='daily'?'diarios':'acumulados'}</span><button class="text-btn" style="margin-left:auto;font-size:10px" onclick="chartMode=chartMode==='daily'?'total':'daily';render()">Ver ${chartMode==='daily'?'acumulados':'diarios'} ${icon('arrow')}</button></div><div class="chart-wrap" id="chart-wrap"><div class="chart-tip" id="chart-tip"></div><svg id="stream-chart" viewBox="0 0 700 176" preserveAspectRatio="none" role="img" aria-label="Evolución de streams"></svg></div></section><section class="panel release-panel"><div class="panel-head"><div><h2>Tus lanzamientos</h2><div class="panel-sub">Últimos lanzamientos.</div></div><button class="text-btn" onclick="navigate('catalog')">Ver catálogo ${icon('arrow')}</button></div>${releaseTable(state.songs.slice(-4).reverse())}</section><section class="panel release-panel"><div class="panel-head"><h2>Global Top 100 <span class="muted small" style="font-weight:400;margin-left:8px">Lo que suena ahora</span></h2><button class="text-btn" onclick="navigate('charts')">Ver chart ${icon('arrow')}</button></div>${chartTable(getChart().slice(0,3),true)}</section></div><div class="right-column"><section class="panel"><div class="panel-head"><h2>Radar de tendencias</h2>${icon('globe')}</div><div class="market-body">${market().sort((a,b)=>b.trend-a.trend).slice(0,4).map((m,i)=>`<div class="market-row"><span>${m.genre}</span><div class="progress"><i style="width:${m.demand/1.4*100}%;opacity:${1-i*.13}"></i></div><b class="${m.trend>=0?'positive':'negative'}">${m.trend>=0?'+':''}${m.trend}%</b></div>`).join('')}<div class="market-note">${icon('spark')}<span><b style="color:#c5b6dc">Una oportunidad para destacar.</b><br>${esc(market().sort((a,b)=>b.saturation-a.saturation)[0].genre)} tiene espacio para nuevos sonidos.</span></div></div></section><section class="panel social-panel"><div class="panel-head"><h2>La conversación</h2><span class="live-badge"><span class="status-dot"></span>LIVE FEED</span></div>${state.feed.slice(0,4).map(feedItem).join('')}<div class="panel-foot">Redes y prensa ficticias · Reacciones del mercado</div></section></div></div>${noArtists?`<div class="onboarding">${icon('help')} Tu primer paso: ve a <kbd>Escena underground</kbd>, investiga un talento y fíchalo. <button class="text-btn" onclick="openGuide()">Guía rápida</button></div>`:!state.songs.length?`<div class="onboarding">${icon('help')} Tu primer paso: pulsa <kbd>Nuevo lanzamiento</kbd> y diseña tu debut. <button class="text-btn" onclick="openGuide()">Guía rápida</button></div>`:''}`}

function kindBadge(s){return s.kind&&s.kind!=='single'?`<span class="badge">${RELEASE_KINDS[s.kind].label}</span>`:''}
function releaseTable(list){if(!list.length)return `<div class="empty">${icon('disc')}<p>El catálogo está vacío.</p>${state.artists.length?`<button class="text-btn" style="margin-top:15px" onclick="openProduction()">Crear mi primer lanzamiento ${icon('arrow')}</button>`:`<button class="text-btn" style="margin-top:15px" onclick="navigate('underground')">Fichar mi primer artista ${icon('arrow')}</button>`}</div>`;return `<div class="table-wrap"><table><thead><tr><th>Track / Artista</th><th>Estado</th><th>Streams</th><th>Chart</th><th></th></tr></thead><tbody>${list.map(s=>`<tr><td><div class="song-info">${songCover(s)}<div><strong>${esc(s.title)} ${kindBadge(s)}</strong><small>${esc(artist(s.artistId).name)} · ${s.genre}</small></div></div></td><td>${songStatus(s)}</td><td>${compact(s.total)}<div class="muted" style="font-size:9px;margin-top:5px">+${compact(s.daily)} hoy</div></td><td class="purple">${s.rank&&s.rank<=100?'#'+s.rank:'—'}</td><td><button class="text-btn" aria-label="Detalles de ${esc(s.title)}" onclick="openSong(${s.id})">${icon('arrow')}</button></td></tr>`).join('')}</tbody></table></div>`}
function chartTable(list,mini=false){return `<div class="table-wrap"><table><thead><tr><th>#</th><th>Canción</th>${mini?'':'<th>Género</th>'}<th>Streams / día</th><th>Movimiento</th></tr></thead><tbody>${list.map(s=>{let diff=s.prevRank?s.prevRank-s.rank:0;return `<tr class="${s.artistId?'own-row':''}"><td class="rank">${s.rank}</td><td><div class="song-info">${songCover(s)}<div><strong>${esc(s.title)} ${s.artistId?'<span class="badge">TU SELLO</span>':''}</strong><small>${esc(s.artistId?artist(s.artistId).name:s.artist)}</small></div></div></td>${mini?'':`<td class="muted">${s.genre}</td>`}<td>${compact(s.daily)}</td><td class="${diff>0?'positive':diff<0?'negative':'muted'}">${!s.prevRank?'<span class="badge green">NEW</span>':diff>0?'↑ '+diff:diff<0?'↓ '+Math.abs(diff):'—'}</td></tr>`}).join('')}</tbody></table></div>`}
function feedItem(f){return `<article class="feed-item"><div class="avatar" style="${f.type==='review'?'background:#303124;color:#d5dfaa':f.type==='news'?'background:#25303b;color:#a0c0de':''}">${f.type==='review'?'P/':f.type==='news'?'M':esc(f.name.slice(1,3).toUpperCase())}</div><div class="feed-copy"><div class="feed-meta"><strong>${esc(f.name)}</strong><span>${f.day===state.day?'Hoy':'Día '+f.day}</span></div><p>${esc(f.text)}</p>${f.score?`<div class="feed-score">${f.score}<span style="font-size:10px;font-weight:400;color:var(--muted)"> / 10</span></div>`:`<div class="feed-foot"><span>♡ ${compact(f.likes)}</span><span>↗ ${fmt(f.likes*.18)}</span>${f.type==='news'?'<span>Industria</span>':''}</div>`}</div></article>`}
function drawChart(){const svg=document.getElementById('stream-chart');if(!svg)return;const history=state.history.slice(-chartWindow),key=chartMode==='daily'?'daily':'total',max=Math.max(1000,...history.map(d=>d[key]))*1.15;const L=48,R=680,T=13,B=145;const pts=history.map((d,i)=>[L+(R-L)*i/Math.max(1,history.length-1),B-(B-T)*d[key]/max]);const path=pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(2)},${p[1].toFixed(2)}`).join(' ');svg.innerHTML=`<defs><linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ac8aff" stop-opacity=".23"/><stop offset="100%" stop-color="#ac8aff" stop-opacity="0"/></linearGradient></defs>${[0,.33,.66,1].map(v=>`<line x1="${L}" x2="${R}" y1="${B-v*(B-T)}" y2="${B-v*(B-T)}" stroke="#2c2934" stroke-dasharray="3 4"/><text x="0" y="${B-v*(B-T)+3}" fill="#78717f" font-size="9">${compact(max*v)}</text>`).join('')}<path d="${path} L${pts.at(-1)[0]},${B} L${L},${B}Z" fill="url(#chartFill)"/><path d="${path}" fill="none" stroke="#b495ef" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${history.length<2?`<circle cx="${L}" cy="${B}" r="3" fill="#b495ef"/>`:''}${[0,.25,.5,.75,1].map(v=>`<text x="${L+v*(R-L)}" y="170" text-anchor="${v===0?'start':v===1?'end':'middle'}" fill="#78717f" font-size="9">Día ${history[Math.round((history.length-1)*v)].day}</text>`).join('')}<line id="chart-hover-line" x1="0" x2="0" y1="${T}" y2="${B}" stroke="#ac8aff88" style="display:none"/>`;svg.onpointermove=e=>{const rect=svg.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width*700,index=Math.round(clamp((x-L)/(R-L),0,1)*(history.length-1));const h=history[index],tip=document.getElementById('chart-tip'),line=document.getElementById('chart-hover-line');tip.style.display='block';tip.style.left=clamp((e.clientX-rect.left)/rect.width*100,15,65)+'%';tip.textContent=`Día ${h.day} · ${fmt(h[key])} streams`;line.style.display='block';line.setAttribute('x1',pts[index][0]);line.setAttribute('x2',pts[index][0])};svg.onpointerleave=()=>{document.getElementById('chart-tip').style.display='none';document.getElementById('chart-hover-line').style.display='none'}}
function undergroundPage(){return heading('Escena underground','Prospectos disponibles para investigar y fichar.',false)+(!state.artists.length?`<div class="notice">${icon('spark')} Todavía no tienes artistas. Investiga un prospecto para conocer sus estadísticas y luego fíchalo para empezar tu carrera como mánager.</div>`:'')+`<div class="toolbar"><button class="btn small-btn" ${state.day-state.lastScoutDay<3?'disabled':''} onclick="exploreScene()">${icon('scout')} Explorar la escena · $600${state.day-state.lastScoutDay<3?' · espera '+(3-(state.day-state.lastScoutDay))+' d':''}</button></div><div class="artist-grid">${state.prospects.map(prospectCard).join('')}${!state.prospects.length?'<div class="empty">No hay prospectos disponibles. Explora la escena para encontrar más talento.</div>':''}</div>`}
function prospectCard(p){return `<section class="panel artist-card prospect-card ${p.discovered?'':'locked'}"><div class="artist-header">${songCover(p,true)}<div><h3>${p.discovered?esc(p.name):'??? del underground'}</h3><span class="muted small">${p.genre} · ${p.discovered?'Disponible para fichar':'Talento sin investigar'}</span></div></div>${p.discovered?`<div class="trait-list">${p.traits.map(t=>`<span class="badge">${t}</span>`).join('')}</div>${[['Talento',p.talent,'#b99af3'],['Salud mental',p.health,'#bce98e'],['Ego',p.ego,'#e1b17f']].map(([t,v,c])=>`<div class="stat"><span>${t}</span><b>${Math.round(v)} <span class="muted" style="font-weight:400">/ 100</span></b></div><div class="progress"><i style="width:${v}%;background:${c}"></i></div>`).join('')}`:`<p class="help">Invierte en investigarlo para conocer su talento, salud mental y rasgos antes de ficharlo.</p>`}<div class="artist-actions">${p.discovered?`<button class="btn small-btn" ${state.cash<p.signCost?'disabled':''} onclick="signProspect('${p.id}')">Fichar · ${money(p.signCost)}</button>`:`<button class="btn small-btn ghost" ${state.cash<p.scoutCost?'disabled':''} onclick="scoutProspect('${p.id}')">Investigar · ${money(p.scoutCost)}</button>`}</div></section>`}
function scoutProspect(id){const p=state.prospects.find(x=>x.id===id);if(!p||p.discovered)return;if(state.cash<p.scoutCost)return toast('Fondos insuficientes para investigar a este prospecto.');state.cash-=p.scoutCost;p.discovered=true;save();render();toast(`Investigación completa: ${p.name} ahora muestra sus estadísticas.`)}
function signProspect(id){const p=state.prospects.find(x=>x.id===id);if(!p||!p.discovered)return;if(state.cash<p.signCost)return toast('Fondos insuficientes para fichar a este artista.');state.cash-=p.signCost;const first=state.artists.length===0;state.artists.push({id:state.artistUid++,name:p.name,genre:p.genre,talent:p.talent,ego:p.ego,health:p.health,scandal:p.scandal,fame:p.fame,traits:p.traits,restUntil:0,trained:0,cover:p.cover,managerId:state.manager.id,signedDay:state.day});state.prospects=state.prospects.filter(x=>x.id!==id);addLog(`${first?'Tu primer fichaje':'Nuevo fichaje'}: ${p.name} se une a ${state.manager.name}.`);addFeed('news','The Daily Mix',`${state.manager.name} ficha a ${p.name}, un talento del underground de ${p.genre}.`);save();render();navigate('artists');toast(first?`${p.name} es tu primer artista. Tu carrera como mánager empieza ahora.`:`${p.name} ahora forma parte de tu sello.`)}
function exploreScene(){if(state.day-state.lastScoutDay<3)return;if(state.cash<600)return toast('Necesitas $600 para explorar la escena.');state.cash-=600;state.lastScoutDay=state.day;state.prospects=generateProspects(6);save();render();toast('Nueva ronda de prospectos disponible en la escena underground.')}
function artistsPage(){if(!state.artists.length)return heading('Artistas','Tu plantel: salud, ego y rendimiento.',false)+`<div class="empty">${icon('artists')}<p>Todavía no has fichado a ningún artista.</p><button class="text-btn" style="margin-top:12px" onclick="navigate('underground')">Ir a la escena underground ${icon('arrow')}</button></div>`;return heading('Artistas','Tu plantel: salud, ego y rendimiento.')+`<div class="notice">${icon('heart')} La salud mental influye en la grabación y la promoción. Por debajo de 22, un artista puede cancelar el estreno. El descanso también es una inversión.</div><div class="artist-grid">${state.artists.map(artistCard).join('')}</div>`}
function artistCard(a){const activeTour=state.tours.find(t=>t.artistId===a.id&&t.status==='active');return `<section class="panel artist-card"><div class="artist-header">${songCover(a,true)}<div><h3>${esc(a.name)}</h3><span class="muted small">${a.genre} · ${a.restUntil>=state.day?'En descanso':activeTour?'De gira':state.songs.some(s=>s.artistId===a.id&&s.status==='production')?'En el estudio':'Artista independiente'}</span></div></div><div class="trait-list">${a.traits.map(t=>`<span class="badge">${t}</span>`).join('')}</div>${[['Talento',a.talent,'#b99af3'],['Ego',a.ego,'#e1b17f'],['Salud mental',a.health,a.health<35?'#f28c9d':'#bce98e'],['Propensión al escándalo',a.scandal,'#cd8fb4'],['Fama',a.fame,'#89accf']].map(([t,v,c])=>`<div class="stat"><span>${t}</span><b>${Math.round(v)} <span class="muted" style="font-weight:400">/ 100</span></b></div><div class="progress"><i style="width:${v}%;background:${c}"></i></div>`).join('')}${activeTour?`<div class="tour-card">De gira · presupuesto <b>${money(activeTour.budget)}</b> · vuelve el día <b>${activeTour.endDay}</b></div>`:''}<div class="artist-actions"><button class="btn small-btn" onclick="openArtist(${a.id})">Gestionar artista</button><button class="btn small-btn ghost" onclick="openProduction(${a.id})">${icon('plus')} Lanzamiento</button>${a.fame>=30&&!activeTour?`<button class="btn small-btn ghost" onclick="openTour(${a.id})">${icon('bolt')} Gira</button>`:a.fame<30?`<span class="muted small" style="align-self:center">Gira desde 30 de fama</span>`:''}</div></section>`}
function catalogPage(){return heading('Catálogo','Todos tus lanzamientos.')+`<div class="metric-grid">${metric('Lanzamientos',state.songs.length,'disc','Producciones de tu sello')}${metric('En estudio',state.songs.filter(s=>s.status==='production').length,'clock','Lanzamientos en producción')}${metric('Calidad media',state.songs.length?Math.round(state.songs.reduce((n,s)=>n+s.quality,0)/state.songs.length)+'/100':'—','spark','Calidad técnica de tus producciones')}${metric('Regalías acumuladas',money(state.totalRevenue),'wallet','80% para el sello · 20% para artistas')}</div><section class="panel">${releaseTable([...state.songs].reverse())}</section>`}
function chartsPage(){let list=getChart().filter(s=>(!ownOnly||s.artistId)&&(!chartQuery||(s.title+' '+(s.artistId?artist(s.artistId).name:s.artist)).toLowerCase().includes(chartQuery.toLowerCase())));chartPage=Math.min(chartPage,Math.max(0,Math.ceil(list.length/20)-1));return heading('Global Top 100','Ranking diario de canciones.',false)+`<div class="toolbar"><input class="field-input" aria-label="Buscar canción o artista" placeholder="Buscar canción o artista…" value="${esc(chartQuery)}" oninput="searchChart(this)"><button class="pill ${!ownOnly?'active':''}" onclick="ownOnly=false;chartPage=0;render()">Todo el mercado</button><button class="pill ${ownOnly?'active':''}" onclick="ownOnly=true;chartPage=0;render()">Mi sello</button><span class="muted" style="font-size:10px;margin-left:auto">${icon('clock')} Actualizado: día ${state.day}</span></div><section class="panel">${list.length?chartTable(list.slice(chartPage*20,chartPage*20+20)):'<div class="empty">No hay canciones que coincidan en el Top 100. Sigue construyendo tu catálogo.</div>'}<div class="pagination"><span>${list.length} canciones · Página ${chartPage+1} de ${Math.max(1,Math.ceil(list.length/20))}</span><div style="display:flex;gap:8px"><button class="btn small-btn ghost" ${chartPage===0?'disabled':''} onclick="chartPage--;render()">Anterior</button><button class="btn small-btn ghost" ${((chartPage+1)*20>=list.length)?'disabled':''} onclick="chartPage++;render()">Siguiente</button></div></div></section><div class="notice" style="margin-top:20px">Chart ordenado por streams diarios. Compites con 115 canciones simuladas del resto del mercado (no son mánagers rivales), con sus propias curvas de vida, estrenos y géneros. Los puestos no están predeterminados.</div>`}
function searchChart(el){chartQuery=el.value;const pos=el.selectionStart;render();const input=document.querySelector('.toolbar input');input.focus();input.setSelectionRange(pos,pos)}
function crewPage(){return heading('Equipo','Profesionales con los que trabaja el sello.',false)+`<div class="notice">${icon('heart')} Trabajar con la misma gente en tus lanzamientos construye relación. Más relación significa mejor calidad, mejor marketing, mejor prensa y menos gastos.</div><div class="crew-grid">${state.professionals.map(crewCard).join('')}</div>`}
function crewCard(p){return `<section class="panel crew-card"><div class="artist-header"><div class="cover artist-portrait" style="background:linear-gradient(135deg,#3a3350,#6a568f)">${esc(p.name.slice(0,1))}</div><div><h3>${esc(p.name)}</h3><span class="muted small">${p.role} · ${p.specialty}</span></div></div><div class="stat"><span>Reputación</span><b>${Math.round(p.reputation)}/100</b></div><div class="progress"><i style="width:${p.reputation}%;background:#89accf"></i></div><div class="stat"><span>Relación contigo</span><b>${Math.round(p.relationship)}/100</b></div><div class="rel-bar"><i style="width:${p.relationship}%"></i></div><p class="help" style="margin-top:12px">${crewHint(p)}</p></section>`}
function crewHint(p){if(p.role==='Productor')return 'Súmalo a un lanzamiento en el estudio para mejorar su calidad.';if(p.role==='Promotor')return 'Súmalo a un lanzamiento para mejorar su marketing mientras esté en circulación.';if(p.role==='Periodista')return 'Buena relación mejora las reseñas de prensa de todo el sello.';return 'Buena relación reduce tus costes operativos diarios.'}
function marketPage(){return heading('Mercado','Tendencias, saturación y cómo se calcula un hit.',false)+`<section class="panel"><div class="table-wrap"><table><thead><tr><th>Género</th><th>Demanda</th><th>Competidores activos</th><th>Factor de saturación</th><th>Oportunidad</th></tr></thead><tbody>${market().sort((a,b)=>b.demand*b.saturation-a.demand*a.saturation).map(m=>`<tr><td><strong>${m.genre}</strong></td><td class="${m.trend>=0?'positive':'negative'}">${m.trend>=0?'+':''}${m.trend}%</td><td>${m.count}</td><td>×${m.saturation.toFixed(2)}</td><td><span class="badge ${m.demand*m.saturation>.95?'green':'orange'}">${m.demand*m.saturation>.95?'En expansión':'Competido'}</span></td></tr>`).join('')}</tbody></table></div></section><div class="insight-grid" style="margin-top:22px"><section class="panel formula"><h3>${icon('spark')} La fórmula de una buena canción</h3><p>La coherencia importa tanto como la inversión. Género, letra, audiencia y estilo tienen matrices propias. El subgénero puede reforzar la propuesta. Un buen productor en el crew también suma calidad.</p><code>Calidad = (63% talento efectivo + 28% sinergia + producción) × salud + rasgos + bono de productor/colaboración<br>Calidad final × inspiración aleatoria [0,85 — 1,15] × precisión del estudio en vivo</code><p>Fuera del género preferido, el talento rinde al 79%. Un perfeccionista aporta +3 puntos, pero necesita un día más de estudio. Indie Head prefiere Underground y pierde calidad en Comercial.</p></section><section class="panel formula"><h3>${icon('streams')} Anatomía de un hit</h3><p>Subida en días 1–7. Pico entre días 8–28. Decaimiento posterior. Calidad ≥87 convierte el track en clásico de catálogo, con caída más lenta y un suelo del 18%. EPs y álbumes tienen un pequeño impulso extra pero cuestan y tardan más.</p><code>Streams = base(fama, calidad²·¹) × ciclo de vida × marketing (+ relación con tu promotor) × demanda × saturación × salud × hype × viralidad</code><p>TikTok impulsa descubrimiento y viralidad; playlists mantienen el alcance; prensa amplifica la campaña. Sus efectos se agotan a ritmos diferentes. Viral Titan aumenta la probabilidad de un breakout.</p></section><section class="panel formula"><h3>${icon('wallet')} Economía transparente</h3><p>Cada stream produce $0,0035; el sello recibe el 80%. Coste operativo base: hasta $390 al día (una buena relación con un ejecutivo del crew lo reduce). La inversión de producción y marketing se paga una sola vez, al entrar al estudio. No hay audio real ni compras con dinero real.</p><code>Ingreso del sello = streams × $0,0035 × 0,80<br>Flujo diario = ingresos − gasto operativo</code><p>Dos anticipos automáticos de $15.000 evitan la primera quiebra, a cambio de fama. Después puedes aceptar un patrocinio de emergencia. Las giras devuelven ingresos y fama al finalizar, a costa de la salud del artista.</p><button class="btn small-btn" style="margin-top:15px" ${state.cash>=15000?'disabled':''} onclick="sponsor()">Patrocinio +$12.000 · Fama −5 / Ego +3</button></section><section class="panel formula"><h3>${icon('disc')} Tu partida, a salvo</h3><p>El juego se guarda en este navegador cada día simulado y después de cada decisión. Al volver, el reloj estará en pausa. Exporta una copia si vas a cambiar de dispositivo.</p><div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap"><button class="btn small-btn" onclick="exportSave()">Exportar partida</button><button class="btn small-btn ghost" onclick="document.getElementById('import-save').click()">Importar partida</button><input type="file" id="import-save" accept="application/json,.json" class="hidden" onchange="importSave(this.files[0])"><button class="text-btn negative" onclick="confirmReset()">Reiniciar sello</button></div></section></div>`}
function sponsor(){if(state.cash>=15000)return;state.cash+=12000;state.artists.forEach(a=>{a.fame=clamp(a.fame-5);a.ego=clamp(a.ego+3)});addLog('Patrocinio aceptado: +$12.000. La audiencia cuestiona la autenticidad del sello: fama −5 y ego +3 por artista.');save();render();toast('Patrocinio firmado. Tienes otra oportunidad.')}
function logPage(){return heading('Noticias del sello','Decisiones, noticias y eventos.',false)+`<div class="insight-grid"><section class="panel"><div class="panel-head" style="padding-bottom:20px"><h2>Diario del sello</h2><span class="badge">Día ${state.day}</span></div>${state.log.map(l=>`<div class="log-item"><span class="log-day">DÍA ${l.day}</span><span>${esc(l.text)}</span></div>`).join('')}</section><section class="panel"><div class="panel-head" style="padding-bottom:15px"><h2>El feed completo</h2><span class="live-badge">EN VIVO</span></div>${state.feed.slice(0,20).map(feedItem).join('')}</section></div>`}
function showModal(html,type='normal'){modal=type;resetTimer();document.body.classList.add('modal-open');document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this&&modal!=='event'&&modal!=='rhythm')closeModal()"><section class="modal ${type==='normal'||type==='production'||type==='rhythm'?'':'narrow'}" role="dialog" aria-modal="true" aria-labelledby="modal-title">${html}</section></div>`;setTimeout(()=>document.querySelector('.modal input,.modal button')?.focus(),50)}
function closeModal(force=false){if(state.event&&!force)return;if(modal==='rhythm'){if(rGame.raf)cancelAnimationFrame(rGame.raf);document.removeEventListener('keydown',rhythmKeydown)}modal=null;document.body.classList.remove('modal-open');document.getElementById('modal-root').innerHTML='';resetTimer()}
function modalHead(title,sub,closable=true){return `<div class="modal-head"><div><h2 id="modal-title">${title}</h2><p>${sub}</p></div>${closable?'<button class="close-btn" aria-label="Cerrar" onclick="closeModal()">×</button>':''}</div>`}

let rGame={laneKeys:['D','F','J','K'],notes:[],hits:0,misses:0,combo:0,best:0,startTime:0,duration:14000,raf:null,songId:null};
function openRhythmGame(songId){const song=state.songs.find(x=>x.id===songId);if(!song)return;rGame={laneKeys:['D','F','J','K'],notes:[],hits:0,misses:0,combo:0,best:0,startTime:0,duration:14000,raf:null,songId};showModal(modalHead('Sesión de grabación en vivo',`MINIJUEGO · Marca el ritmo de «${esc(song.title)}»`,false)+`<div class="modal-body"><p class="help">Pulsa <b>D F J K</b> (o toca los carriles) justo cuando el bloque cruce la línea. Tu precisión ajusta hasta un ±15% la calidad final del lanzamiento.</p><div class="rhythm-hud"><span>Combo máximo: <b id="rhythm-combo">0</b></span><button class="text-btn" onclick="skipRhythm(${songId})">Saltar minijuego</button></div><div class="rhythm-wrap" id="rhythm-wrap"><div class="hit-line"></div>${[0,1,2,3].map(i=>`<div class="lane" data-lane="${i}" onpointerdown="judgeLane(${i})"><div class="lane-key">${rGame.laneKeys[i]}</div></div>`).join('')}</div></div>`,'rhythm');startRhythm()}
function startRhythm(){let t=1200;while(t<rGame.duration-800){rGame.notes.push({lane:Math.floor(rand()*4),time:t,hit:false,judged:false});t+=between(420,780)}rGame.startTime=performance.now();document.addEventListener('keydown',rhythmKeydown);rGame.raf=requestAnimationFrame(rhythmLoop)}
function rhythmKeydown(e){const idx=['d','f','j','k'].indexOf(e.key.toLowerCase());if(idx<0)return;judgeLane(idx)}
function judgeLane(lane){if(!rGame.startTime)return;const now=performance.now()-rGame.startTime;let candidate=null,bestDelta=9999;rGame.notes.forEach(n=>{if(n.lane===lane&&!n.judged){const d=Math.abs(now-n.time);if(d<230&&d<bestDelta){bestDelta=d;candidate=n}}});if(candidate){candidate.judged=true;candidate.hit=true;rGame.hits++;rGame.combo++;rGame.best=Math.max(rGame.best,rGame.combo);const el=document.getElementById('rhythm-combo');if(el)el.textContent=rGame.best}}
const RHYTHM_TRAVEL=1500;
function rhythmLoop(now){if(!rGame.startTime)return;const elapsed=now-rGame.startTime;rGame.notes.forEach(n=>{if(!n.judged&&elapsed>n.time+230){n.judged=true;n.hit=false;rGame.misses++;rGame.combo=0}});const wrap=document.getElementById('rhythm-wrap');if(wrap){for(let lane=0;lane<4;lane++){const laneEl=wrap.children[lane+1];if(!laneEl)continue;const tiles=rGame.notes.filter(n=>n.lane===lane&&elapsed>n.time-RHYTHM_TRAVEL-200&&elapsed<n.time+300);laneEl.querySelectorAll('.tile').forEach(t=>t.remove());tiles.forEach(n=>{const top=clamp(((elapsed-(n.time-RHYTHM_TRAVEL))/RHYTHM_TRAVEL)*84,-10,94);const div=document.createElement('div');div.className='tile'+(n.judged?n.hit?' hit':' miss':'');div.style.top=top+'%';laneEl.appendChild(div)})}}if(elapsed>rGame.duration+800){endRhythm();return}rGame.raf=requestAnimationFrame(rhythmLoop)}
function endRhythm(){if(rGame.raf)cancelAnimationFrame(rGame.raf);document.removeEventListener('keydown',rhythmKeydown);const score=Math.round(rGame.hits/Math.max(1,rGame.hits+rGame.misses)*100);const wrap=document.getElementById('rhythm-wrap');if(wrap)wrap.innerHTML=`<div style="display:grid;place-items:center;height:100%;text-align:center;width:100%"><div><div class="rhythm-score">${score}/100</div><p class="help" style="margin-top:10px">Combo máximo: ${rGame.best} · Aciertos: ${rGame.hits} · Fallos: ${rGame.misses}</p><button class="btn primary" style="margin-top:16px" onclick="finalizeRhythm(${score},${rGame.songId})">Continuar ${icon('arrow')}</button></div></div>`}
function skipRhythm(songId){if(rGame.raf)cancelAnimationFrame(rGame.raf);document.removeEventListener('keydown',rhythmKeydown);finalizeRhythm(65,songId)}
function finalizeRhythm(score,songId){const s=state.songs.find(x=>x.id===songId);if(s){const perf=.85+score/100*.3;s.quality=clamp(s.quality*perf);if(s.producerId){const p=pro(s.producerId);if(p)p.relationship=clamp(p.relationship+4,0,100)}if(s.promoterId){const p=pro(s.promoterId);if(p)p.relationship=clamp(p.relationship+4,0,100)}}save();closeModal(true);render();toast(s?`Sesión terminada: ${score}/100 de precisión. Calidad final: ${Math.round(s.quality)}/100.`:'Sesión terminada.')}

function exportSave(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nocturne_dia_'+state.day+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Partida exportada.')}
function importSave(file){if(!file)return;if(file.size>5e6)return toast('La partida supera el límite de 5 MB.');const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!validSave(s))throw Error();state=s;playing=false;save();closeModal(true);resetTimer();render();if(state.event)openEvent();toast('Partida recuperada. El reloj está en pausa.')}catch(e){toast('Archivo de partida inválido. Tu sello no ha cambiado.')}};r.readAsText(file)}
function confirmReset(){if(state.event)return openEvent();showModal(modalHead('¿Reiniciar la partida?','Esta acción sustituye tu partida local.')+`<div class="modal-body"><p class="help">Perderás tu catálogo y tu progreso actual, y volverás a empezar sin artistas fichados. Puedes exportar tu partida desde Mercado antes de continuar.</p><div style="display:flex;gap:10px;margin-top:23px"><button class="btn" onclick="closeModal()">Volver a mi sello</button><button class="btn primary" onclick="playing=false;fresh();closeModal(true);navigate('dashboard');toast('Partida reiniciada.')">Reiniciar</button></div></div>`,'reset')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal!=='event')closeModal();if(e.code==='Space'&&!modal&&!['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();togglePlay()}if(e.key==='Tab'&&modal){const nodes=[...document.querySelectorAll('.modal button:not(:disabled),.modal input,.modal select')].filter(n=>n.offsetParent!==null);if(!nodes.length)return;const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden){playing=false;resetTimer();save();renderTop()}});render();if(state.event)openEvent();
</script>
</body>
</html>
